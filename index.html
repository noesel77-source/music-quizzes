<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instrumente erkennen – Hörquiz</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183044;background:#f0f5f9}body{margin:0}main{max-width:850px;margin:auto;padding:24px 16px 60px}header,.question,#results{background:white;border:1px solid #d9e5ec;border-radius:16px;padding:22px;margin-bottom:16px}h1{margin:0 0 6px;font-size:1.8rem}h2{font-size:1.1rem;margin:0 0 14px}.muted{color:#516b7d}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:650;background:#1465a4;color:white}button.secondary{background:#e2edf5;color:#15496b}button:disabled{opacity:.6;cursor:default}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.player{display:flex;align-items:center;gap:12px;background:#eef6fa;padding:12px;border-radius:12px;margin:12px 0}.player button{min-width:145px}.time{font-variant-numeric:tabular-nums;color:#456;font-size:.9rem}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.answer{display:block;padding:12px;border:1px solid #cfdae2;border-radius:10px;cursor:pointer}.answer:has(input:checked){border-color:#1465a4;background:#eef7ff}.answer input{margin-right:8px}.status{margin:12px 0 0;font-weight:650}.correct{color:#087442}.wrong{color:#b02b2b}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}#results[hidden]{display:none}@media(max-width:530px){.answers{grid-template-columns:1fr}.player{flex-wrap:wrap}}
</style></head><body><main>
<header><div class="top"><div><h1>🎧 Instrumente erkennen</h1><div class="muted">Musik · Jahrgang 7 · 10 Hörbeispiele</div></div><button id="shuffle" class="secondary" type="button">🔀 Neu mischen</button></div><p>Höre dir jeden Ausschnitt an. Welches Instrument ist zu hören? Wähle jeweils eine Antwort. Du kannst jeden Ausschnitt mehrfach abspielen.</p><small class="muted">Version 4 · Nur Audio · Zufallsreihenfolge</small></header>
<div id="quiz"></div><div class="actions"><button id="grade" type="button">Antworten auswerten</button></div><section id="results" hidden aria-live="polite"></section>
<audio id="audio" preload="metadata" src="Instruments%20of%20the%20Orchestra.mp3"></audio>
</main><script>
'use strict';
// Die vollständige Originaldatei bleibt unverändert. start/end sind Sekunden ab Dateibeginn.
const items=[
 {instrument:'Violine',start:11,end:28,choices:['Violine','Viola','Cello','Kontrabass']},
 {instrument:'Cello',start:48,end:66,choices:['Kontrabass','Cello','Viola','Violine']},
 {instrument:'Kontrabass',start:68,end:90,choices:['Tuba','Cello','Kontrabass','Fagott']},
 {instrument:'Oboe',start:111,end:124,choices:['Klarinette','Flöte','Englischhorn','Oboe']},
 {instrument:'Querflöte',start:126,end:141,choices:['Querflöte','Piccolo','Oboe','Klarinette']},
 {instrument:'Klarinette',start:156,end:172,choices:['Fagott','Klarinette','Oboe','Querflöte']},
 {instrument:'Fagott',start:174,end:190,choices:['Posaune','Kontrafagott','Fagott','Klarinette']},
 {instrument:'Tuba',start:213,end:229,choices:['Waldhorn','Trompete','Posaune','Tuba']},
 {instrument:'Trompete',start:251,end:266,choices:['Trompete','Waldhorn','Posaune','Tuba']},
 {instrument:'Glockenspiel',start:299,end:312,choices:['Klavier','Glockenspiel','Pauke','Harfe']}
];
const audio=document.getElementById('audio'),quiz=document.getElementById('quiz'),results=document.getElementById('results');
let order=[],active=null,stopAt=0,run=0;
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function stop(){audio.pause();active=null;document.querySelectorAll('.play').forEach(b=>b.textContent='▶ Anhören');}
function play(qid){const q=order[qid];if(active===qid&&!audio.paused){stop();return;}stop();active=qid;stopAt=q.end;const b=document.getElementById('play-'+qid);b.textContent='■ Stoppen';
 const current=++run;
 const startPlayback=()=>{if(current!==run)return;const promise=audio.play();if(promise)promise.catch(()=>{if(current===run){stop();alert('Audio konnte nicht gestartet werden. Prüfe, ob die MP3-Datei im selben GitHub-Ordner liegt.');}});};
 if(audio.readyState<1){audio.addEventListener('loadedmetadata',()=>{if(current!==run)return;audio.currentTime=q.start;startPlayback();},{once:true});audio.load();}else{audio.currentTime=q.start;startPlayback();}}
audio.addEventListener('timeupdate',()=>{if(active!==null&&audio.currentTime>=stopAt-.12)stop();});audio.addEventListener('ended',stop);
function render(){run++;stop();results.hidden=true;results.innerHTML='';order=shuffle(items);quiz.innerHTML='';order.forEach((q,i)=>{const s=document.createElement('section');s.className='question';const h=document.createElement('h2');h.textContent=`Frage ${i+1} von ${order.length}: Welches Instrument hörst du?`;s.append(h);
 const player=document.createElement('div');player.className='player';const b=document.createElement('button');b.type='button';b.className='play';b.id='play-'+i;b.textContent='▶ Anhören';b.onclick=()=>play(i);const hint=document.createElement('span');hint.className='time';hint.textContent='Hörbeispiel abspielen';player.append(b,hint);s.append(player);
 const choices=document.createElement('div');choices.className='answers';shuffle(q.choices).forEach((name,j)=>{const l=document.createElement('label');l.className='answer';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=name;l.append(input,document.createTextNode(name));choices.append(l);});s.append(choices);const status=document.createElement('p');status.id='status-'+i;status.className='status';status.setAttribute('aria-live','polite');s.append(status);quiz.append(s);});}
document.getElementById('shuffle').onclick=render;
document.getElementById('grade').onclick=()=>{stop();let score=0,answered=0;order.forEach((q,i)=>{const selected=document.querySelector(`input[name="q${i}"]:checked`);const status=document.getElementById('status-'+i);if(selected)answered++;const ok=selected&&selected.value===q.instrument;if(ok)score++;status.className='status '+(ok?'correct':'wrong');status.textContent=ok?'✓ Richtig!':`✗ Richtige Antwort: ${q.instrument}`;});results.hidden=false;results.innerHTML=`<h2>Dein Ergebnis: ${score} von ${order.length} Punkten</h2><p>${answered} von ${order.length} Fragen beantwortet. Du kannst die Antworten ändern und erneut auswerten oder oben auf „Neu mischen“ klicken.</p>`;results.scrollIntoView({behavior:'smooth',block:'nearest'});};
render();
</script></body></html>
